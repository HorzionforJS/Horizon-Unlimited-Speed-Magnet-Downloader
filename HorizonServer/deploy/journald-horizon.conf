# Horizon 服务端日志上限。
#
# 服务端的访问日志由 gin.Logger() 写到 stdout，经 systemd 收进 journal。
# journal 默认只受磁盘空间限制（满盘会挤掉所有历史），
# 这里给它一个明确上限，避免长期运行把磁盘写满。
#
# 用 journald 的配置而不是 logrotate：journal 是二进制格式，
# 由 journald 自己管理，外部裁剪文件会破坏索引。

[Journal]
# 整个 journal 最多占 500M，超过就先丢最旧的
SystemMaxUse=500M
# 单个 journal 文件上限，避免出现超大单文件
SystemMaxFileSize=100M
# 保留时长上限，和容量上限谁先到用谁
MaxRetentionSec=4week
