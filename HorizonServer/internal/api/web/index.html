<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地平线磁力搜索 · Horizon</title>
<style>
  :root{
    --bg:#0b0e17; --bg2:#111527; --panel:#151a2e; --panel2:#1a2038;
    --line:#262d47; --text:#e7ebf5; --muted:#8b93ad; --faint:#5c6478;
    --accent:#7c6cff; --accent-hi:#9488ff; --green:#2fd57b; --red:#ff5c6d; --warn:#f5b942;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,Arial,sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* 顶栏 */
  header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;
    padding:0 28px;height:60px;background:rgba(11,14,23,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.3px}
  .logo .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#4ecdc4);box-shadow:0 0 14px var(--accent)}
  nav{display:flex;gap:4px;flex:1}
  nav a{padding:8px 14px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
  nav a:hover{color:var(--text);background:var(--bg2)}
  nav a.on{color:var(--text);background:var(--bg2)}
  .hstat{margin-left:auto;color:var(--muted);font-size:13px}

  /* 主容器 */
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}

  /* Hero */
  .hero{padding:64px 0 26px;text-align:center}
  .hero h1{font-size:40px;font-weight:900;line-height:1.2;letter-spacing:.5px}
  .hero h1 .grad{background:linear-gradient(90deg,var(--accent-hi),#4ecdc4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{margin:16px auto 0;max-width:620px;color:var(--muted);font-size:16px;line-height:1.7}
  .searchbar{display:flex;gap:10px;max-width:700px;margin:30px auto 0}
  .searchbar input{flex:1;height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--line);
    background:var(--bg2);color:var(--text);font-size:15px;outline:none}
  .searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.18)}
  .searchbar select{height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);
    background:var(--bg2);color:var(--text);font-size:14px;outline:none;cursor:pointer}
  .searchbar button{height:52px;padding:0 26px;border-radius:14px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-hi));color:#fff;font-size:15px;font-weight:700}
  .searchbar button:hover{filter:brightness(1.08)}
  .cat-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 0}
  .chip{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip:hover{color:var(--text)}
  .stats{display:flex;gap:36px;justify-content:center;margin:26px 0 0;color:var(--muted);font-size:13px}
  .stats b{color:var(--text);font-size:16px}

  /* 区块标题 */
  .sec{display:flex;align-items:center;justify-content:space-between;margin:44px 0 16px}
  .sec h2{font-size:20px;font-weight:800}
  .sec .more{color:var(--accent-hi);font-size:13px;font-weight:600;cursor:pointer}

  /* 结果卡片网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;
    display:flex;flex-direction:column;gap:11px;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .t{font-size:14px;font-weight:700;line-height:1.45;height:2.9em;overflow:hidden;word-break:break-all}
  .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--muted)}
  .badge.cat{background:rgba(124,108,255,.16);color:var(--accent-hi)}
  .badge.up{background:rgba(47,213,123,.15);color:var(--green)}
  .badge.dn{background:rgba(255,92,109,.15);color:var(--red)}
  .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
  .meta .sz{font-weight:700;color:var(--text)}
  .acts{display:flex;gap:8px;margin-top:auto}
  .btn{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);
    font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .1s}
  .btn:hover{border-color:var(--accent);color:var(--accent-hi)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-hi));border:none;color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
    padding:11px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  .toast.show{opacity:1}
  footer{margin:60px 0 30px;padding-top:22px;border-top:1px solid var(--line);color:var(--faint);font-size:12px;text-align:center;line-height:1.8}
  @media(max-width:640px){.hero h1{font-size:28px}.searchbar{flex-wrap:wrap}.searchbar select,.searchbar input{min-width:100px}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>地平线磁力搜索</div>
  <nav>
    <a class="on" data-mode="search">搜索</a>
    <a data-mode="top">热门</a>
  </nav>
  <div class="hstat" id="stat">Horizon · 种子搜索</div>
</header>

<div class="wrap">
  <section class="hero">
    <h1>想要的种子，<span class="grad">全都找得到</span></h1>
    <p>聚合全球种子索引，返回磁力链接并附带做种数、大小与类型。搜到就能直接复制磁力，拖进「地平线磁力下载」客户端即可下载。</p>
    <div class="searchbar">
      <input id="q" placeholder="搜索电影、剧集、音乐、游戏、软件…" autofocus>
      <select id="cat">
        <option value="0">全部类型</option>
        <option value="207">电影</option>
        <option value="208">剧集</option>
        <option value="211">4K电影</option>
        <option value="100">音乐</option>
        <option value="400">游戏</option>
        <option value="300">软件</option>
        <option value="600">其他</option>
      </select>
      <button id="go">搜索</button>
    </div>
    <div class="cat-chips" id="chips">
      <span class="chip on" data-cat="0">全部</span>
      <span class="chip" data-cat="207">电影</span>
      <span class="chip" data-cat="208">剧集</span>
      <span class="chip" data-cat="100">音乐</span>
      <span class="chip" data-cat="400">游戏</span>
      <span class="chip" data-cat="300">软件</span>
    </div>
    <div class="stats">
      <div><b>35+</b> 索引源</div>
      <div><b>实时</b> 做种数</div>
      <div><b>磁力</b> 一键复制</div>
      <div><b>免注册</b> 无需登录</div>
    </div>
  </section>

  <div class="sec">
    <h2 id="secTitle">热门 · 最新收录</h2>
    <span class="more" id="refresh">↻ 刷新</span>
  </div>
  <div class="grid" id="grid"><div class="empty">加载中…</div></div>
</div>

<footer>
  数据来源：The Pirate Bay（公开种子索引）。本站仅提供搜索与磁力链接结果，不存储任何文件。<br>
  请遵守当地法律法规，仅下载您有权获取的内容。 · 地平线磁力下载 · Horizon
</footer>
<div class="toast" id="toast"></div>

<script>
(function(){
  var TRACKERS = [
    'udp://tracker.opentrackr.org:1337/announce',
    'udp://open.demonii.com:1337/announce',
    'udp://tracker.torrent.eu.org:451/announce',
    'udp://tracker.openbittorrent.com:6969/announce',
    'udp://exodus.desync.com:6969/announce',
    'http://tracker.openbittorrent.com:80/announce',
    'https://tracker.tamersunion.org/announce'
  ];
  var CAT = {
    '100':'音乐','200':'视频','201':'电影','202':'电影','203':'MV','204':'片段','205':'剧集','206':'手持',
    '207':'电影','208':'剧集','209':'3D','210':'视频','211':'4K电影','212':'4K剧集',
    '300':'软件','400':'游戏','500':'成人','501':'成人','502':'成人','503':'成人','504':'成人','505':'成人','506':'成人',
    '600':'其他'
  };
  function catLabel(c){ return CAT[c] || ('#'+c); }
  function isAdult(c){ return (/^5\d\d$/).test(String(c)); }
  function num(v){ var n = Number(v); return isNaN(n) ? 0 : n; }
  function fmtSize(b){ b=num(b); if(b<=0) return '未知'; var u=['B','KB','MB','GB','TB']; var i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(i?1:0)+' '+u[i]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function magnet(it){
    var ih = String(it.info_hash||'').toLowerCase();
    var dn = String(it.name||'').replace(/\s+/g,' ').trim();
    var tr = TRACKERS.map(function(t){return 'tr='+encodeURIComponent(t);}).join('&');
    return 'magnet:?xt=urn:btih:'+ih+'&dn='+encodeURIComponent(dn)+'&'+tr;
  }

  var toastTimer=null;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},1800); }

  function copyMagnet(it){
    var m = magnet(it);
    function done(){ toast('已复制磁力链接'); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(m).then(done, function(){ fallback(m); }); }
    else fallback(m);
    function fallback(m){
      var ta=document.createElement('textarea'); ta.value=m; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    }
  }

  function item(it){
    var c = String(it.category||'');
    if(state.noAdult && isAdult(c)) return null;
    var card=document.createElement('div'); card.className='card';
    var name=String(it.name||'(未命名)');
    var s=num(it.seeders), l=num(it.leechers);
    card.innerHTML =
      '<div class="t" title="'+esc(name)+'">'+esc(name)+'</div>'+
      '<div class="badges">'+
        '<span class="badge cat">'+catLabel(c)+'</span>'+
        '<span class="badge up">▲ '+s+' 做种</span>'+
        '<span class="badge dn">▼ '+l+' 下载</span>'+
      '</div>'+
      '<div class="meta"><span class="sz">'+fmtSize(it.size)+'</span><span>·</span><span>'+esc(it.username||'匿名')+'</span></div>'+
      '<div class="acts">'+
        '<div class="btn primary" data-act="copy">复制磁力</div>'+
        '<a class="btn" data-act="open" href="'+esc(magnet(it))+'" target="_blank">magnet</a>'+
      '</div>';
    card.querySelector('[data-act=copy]').addEventListener('click', function(){ copyMagnet(it); });
    card.querySelector('[data-act=open]').addEventListener('click', function(e){ e.stopPropagation(); });
    return card;
  }

  var grid=document.getElementById('grid');
  function render(list){
    grid.innerHTML='';
    if(!list || !list.length){ grid.innerHTML='<div class="empty">没有找到相关种子，换个关键词试试。</div>'; return; }
    var frag=document.createDocumentFragment();
    var shown=0;
    for(var i=0;i<list.length;i++){ var el=item(list[i]); if(el){frag.appendChild(el); shown++;} }
    if(!shown){ grid.innerHTML='<div class="empty">没有符合条件的种子（已按当前过滤条件隐藏部分结果）。</div>'; }
    else grid.appendChild(frag);
  }

  var state={ mode:'top', noAdult:true };
  function setMode(m){ state.mode=m; var as=document.querySelectorAll('nav a'); [].forEach.call(as,function(a){a.classList.toggle('on',a.getAttribute('data-mode')===m);}); }

  function loadTop(){
    setMode('top');
    document.getElementById('secTitle').textContent='热门 · 最新收录';
    grid.innerHTML='<div class="empty">加载中…</div>';
    fetch('/api/v1/top').then(function(r){return r.json();}).then(function(d){ render(d.results||[]); })
      .catch(function(){ grid.innerHTML='<div class="empty">加载失败，请稍后再试。</div>'; });
  }

  function doSearch(){
    var q=document.getElementById('q').value.trim();
    var cat=document.getElementById('cat').value;
    setMode('search');
    document.getElementById('secTitle').textContent='搜索结果'+(q?' · 「'+q+'」':'');
    grid.innerHTML='<div class="empty">搜索中…</div>';
    fetch('/api/v1/search?q='+encodeURIComponent(q)+'&cat='+encodeURIComponent(cat))
      .then(function(r){return r.json();}).then(function(d){
        if(d && d.error){ grid.innerHTML='<div class="empty">'+esc(d.error)+'</div>'; return; }
        render((d&&d.results)||[]);
      }).catch(function(){ grid.innerHTML='<div class="empty">搜索失败，请稍后再试。</div>'; });
  }

  document.getElementById('go').addEventListener('click', doSearch);
  document.getElementById('q').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });
  document.getElementById('refresh').addEventListener('click', loadTop);

  // 分类 chips：写回下拉框并搜索
  var chips=document.getElementById('chips');
  chips.addEventListener('click', function(e){
    var t=e.target; if(!t.classList.contains('chip')) return;
    [].forEach.call(chips.children,function(c){c.classList.remove('on');});
    t.classList.add('on');
    document.getElementById('cat').value=t.getAttribute('data-cat');
  });

  // 顶栏导航
  [].forEach.call(document.querySelectorAll('nav a'), function(a){
    a.addEventListener('click', function(){ if(a.getAttribute('data-mode')==='top') loadTop(); else doSearch(); });
  });

  loadTop();
})();
</script>
</body>
</html>
